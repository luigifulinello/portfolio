    <main id="top">

      <!-- ===== MASTHEAD ===== -->

            <span class="cs-crumb-current" aria-current="page"><Short title></span>
          </nav>
          <h1 class="cs-headline"><Project title></h1>
          <p class="cs-tagline"><One-sentence summary of the work and its outcome.></p>
        </div>
      </header>

      <!-- ===== HERO IMAGE (scroll-driven expand) ===== -->
      <div class="cs-hero-track">
        <figure class="cs-hero" aria-label="Hero image placeholder"></figure>
      </div>

      <!-- ===== STICKY TWO-COLUMN INTRO ===== -->
      <section class="cs-intro">
        <div class="cs-wrap cs-intro-grid">
          <aside class="cs-intro-aside">
            <p class="cs-eyebrow">Overview</p>
            <dl class="cs-meta">
              <div class="cs-meta-item"><dt>Company</dt><dd>[Company]</dd></div>
              <div class="cs-meta-item"><dt>Role</dt><dd>[Role]</dd></div>
              <div class="cs-meta-item"><dt>Focus</dt><dd>[Disciplines]</dd></div>
              <div class="cs-meta-item"><dt>Team</dt><dd>[Team]</dd></div>
            </dl>
          </aside>
          <div class="cs-intro-body" data-reveal>
            <p class="cs-intro-lead"><Strong opening sentence — the problem and the stakes.></p>
            <p><Context paragraph.></p>
            <p><Context paragraph — enough that this column scrolls past the sticky meta.></p>
            <p><Why it was prioritized; the shape of the work ahead.></p>
          </div>
        </div>
      </section>

      <!-- ===== Optional: early Impact band (move here when results lead the story) ===== -->

      <!-- ===== APPROACH (full-bleed, word-by-word fill on scroll) =====
           Beat 2: the strategy / the bet. The intro already carried the
           challenge, so the story pivots straight to the approach here. -->
      <section class="cs-statement">
        <div class="cs-wrap">
          <p class="cs-eyebrow">Approach</p>
          <p class="cs-statement-text"><One bold line stating the strategy — the bet that shaped the work.></p>
        </div>
      </section>

      <!-- ===== SHOWCASE IMAGE — visual payoff after the approach (content width) ===== -->
      <figure class="cs-figure cs-figure--wide" data-reveal>
        <div class="cs-fig-inner" aria-label="Image placeholder"></div>
        <figcaption class="cs-caption">Figure 01 — Caption.</figcaption>
      </figure>

      <!-- ===== THE WORK (static grid) — beat 3: what shipped ===== -->
      <section class="cs-section" data-reveal>
        <div class="cs-wrap">
          <h2 class="cs-label cs-label--solo">The work</h2>
          <div class="cs-grid3">
            <figure class="cs-tile-fig" data-reveal><div class="cs-tile"></div><figcaption class="cs-cap"><Caption.></figcaption></figure>
            <figure class="cs-tile-fig" data-reveal><div class="cs-tile"></div><figcaption class="cs-cap"><Caption.></figcaption></figure>
            <figure class="cs-tile-fig" data-reveal><div class="cs-tile"></div><figcaption class="cs-cap"><Caption.></figcaption></figure>
          </div>
          <!-- before/after pair (optional):
          <div class="cs-figure-pair" data-reveal>
            <figure class="cs-tile-fig"><div class="cs-shot"></div><figcaption class="cs-cap">Before.</figcaption></figure>
            <figure class="cs-tile-fig"><div class="cs-shot"></div><figcaption class="cs-cap">After.</figcaption></figure>
          </div>
          -->
        </div>
      </section>

      <!--
        OPTIONAL MODULES — drop in where the content calls for them:

        Reflection as a 3-up takeaways grid (swap for the Reflection section above):
        <div class="cs-takeaways"> … .cs-takeaway (title + text) … </div>

        Before/after comparison with revenue bars:
        <div class="cs-compare"> … .cs-compare-col / .cs-compare-col--after … </div>

        Phased rollout with status pills:
        <ol class="cs-phases"> … .cs-phase (.cs-status--shipped | .cs-status--next) … </ol>

        See navigation-redesign.html for full markup of each.
      -->

      <!-- ===== REFLECTION (two-column) — beat 4 =====
           What you learned, what you'd carry forward. Swap in the Takeaways
           grid (see optional modules above) for a scannable 3-up version. -->
      <section class="cs-section" data-reveal>
        <div class="cs-wrap cs-cols">
          <div class="cs-col-label">
            <h2 class="cs-label">Reflection</h2>
          </div>
          <div class="cs-col-body">
            <p class="cs-body-lead"><The lesson worth carrying forward.></p>
            <p><What surprised you, what you'd do differently, the principle this work proved out.></p>
          </div>
        </div>

        <!-- Closing gallery (C — Hero + 1×2), tied to the reflection -->

          <div class="cs-grid-hero2x2">
            <div class="cs-img--hero"></div>
            <div class="cs-sub2x2">
              <div class="cs-img"></div>

            </div>
          </div>
        </div>
      </section>

        <div class="cs-wrap">
